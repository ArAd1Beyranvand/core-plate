name: tunisia_plate
description: "Tunisia's licence plates for the plate_core library — the `NNN تونس NNNN` plate in one and two lines, rental, government, diplomatic, military and temporary plates, with their themes, alphabets and advisory validators."
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"


dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.3
  plate_alphabet: ^0.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Tunisia.svg
    - assets/tn_military_flag.png
  # Amiri Bold (OFL, assets/fonts/Amiri-OFL.txt), subset to the four letters
  # of تونس: the plates stamp the word in a Naskh hand.
  fonts:
    - family: TunisiaAmiri
      fonts:
        - asset: assets/fonts/Amiri-Bold-tunis.ttf
          weight: 700
