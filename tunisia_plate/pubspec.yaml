name: tunisia_plate
description: "Tunisia's licence plates for the core_plate library — the `NNN تونس NNNN` plate in one and two lines, rental, government, diplomatic, military and temporary plates, with their themes, alphabets and advisory validators."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.11.0
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Tunisia.svg
    - assets/tn_military_flag.png
