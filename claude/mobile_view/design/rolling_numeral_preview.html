<!doctype html>
<!-- MV5 motion reference: Charge (fill + waterline over the 4 s dwell), Roll (spring up),
     Sweep (diagonal light across the stroke), Rewind (09 → 01 spins down). Open in a browser.
     Click right half = next, left half = back, hold = pause. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RollingNumeral preview</title>
<style>
:root{--bg:#050608;--card:#0d0e15;--line:rgba(255,255,255,.08);--ink:#eceef6;--dim:#8a8ea3;--acc:#7c5cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);display:grid;place-items:center;min-height:100vh;
font-family:system-ui,sans-serif;color:var(--ink)}
.mono{font-family:ui-monospace,"JetBrains Mono",monospace;letter-spacing:.18em;font-size:11px;text-transform:uppercase}
.wrap{width:380px}
.bar{display:flex;gap:4px;margin:0 0 22px}.seg{flex:1;height:2px;background:rgba(124,92,255,.22);position:relative;cursor:pointer}
.seg i{position:absolute;inset:0;width:0;background:var(--acc)}.gap{width:6px;flex:none;background:none}
.card{position:relative;height:226px;border:1px solid var(--line);border-radius:6px;background:var(--card);overflow:hidden;user-select:none}
.mark{position:absolute;left:18px;top:-1px;width:30px;height:2px;background:var(--acc);box-shadow:0 0 12px 2px rgba(124,92,255,.7)}
.lab{position:absolute;left:18px;top:28px;color:#a99bff}
.ttl{position:absolute;left:18px;top:50px;font-size:28px;line-height:1.08;font-weight:500;letter-spacing:-.01em;width:220px}
svg{position:absolute;right:-6px;bottom:-34px}
.foot{display:flex;justify-content:space-between;margin-top:14px;color:var(--dim)}
</style></head><body><div class="wrap">
<div class="bar" id="bar"></div>
<div class="card" id="card"><div class="mark"></div><div class="lab mono" id="lab"></div><div class="ttl" id="ttl"></div>
<svg id="num" width="230" height="190" viewBox="0 0 230 190"></svg></div>
<div class="foot mono"><span id="cnt"></span><span>Tap to advance · hold to pause</span></div></div>
<script>
const F=[["mobile","Rules","Validation never blocks a key"],["mobile","Controller","Read and write from code"],["mobile","State","No provider or bloc required"],
["tablet","Alphabets","Every plate types in its own script"],["tablet","Direction","RTL and LTR in one widget"],["tablet","Keypad","Virtual keys that know the spec"],
["desktop","Data","A new country is one const"],["desktop","Packages","Ship only the plates you need"],["desktop","Scale","Everything is customizable"]];
const N=F.length,W=Math.max(2,String(N).length),DWELL=4000,FS=170,H=150,CW=104,NS="http://www.w3.org/2000/svg";
const svg=document.getElementById('num');
svg.innerHTML=`<defs><linearGradient id="sw" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="230" y2="0" gradientTransform="rotate(28 115 95)">
<stop id="s0" offset="0" stop-color="rgba(124,92,255,.35)"/><stop id="s1" offset="0" stop-color="#d9d0ff"/><stop id="s2" offset="0" stop-color="rgba(124,92,255,.35)"/></linearGradient></defs>`;
const el=(t,a,p=svg)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e};
const txt=(p,d,y,extra)=>el('text',Object.assign({x:CW/2,y,'text-anchor':'middle','font-size':FS,'font-family':'ui-monospace,JetBrains Mono,monospace',
 style:'font-feature-settings:"zero"'},extra),p).textContent=d;
const cols=[];
for(let c=0;c<W;c++){
 const x=c*CW+10, clip=el('clipPath',{id:'c'+c},svg.firstChild); el('rect',{x:0,y:0,width:CW,height:H+40},clip);
 const g=el('g',{transform:`translate(${x},0)`,'clip-path':`url(#c${c})`}), strip=el('g',{},g);
 for(let d=-1;d<=11;d++) txt(strip,((d%10)+10)%10,H+d*H,{fill:'none',stroke:'url(#sw)','stroke-width':1.4});
 cols.push({g,strip,pos:0,from:0,to:0,t0:0,dur:1,ease:null});
}
// charge layer on the last column: fill + waterline, clipped by level
const last=cols[W-1].g, fc=el('clipPath',{id:'fc'},svg.firstChild), fr=el('rect',{x:0,width:CW,y:H,height:0},fc);
const wc=el('clipPath',{id:'wc'},svg.firstChild), wr=el('rect',{x:0,width:CW,y:H,height:1.6},wc);
const fillG=el('g',{'clip-path':'url(#fc)'},last), waterG=el('g',{'clip-path':'url(#wc)'},last);
const fillT=el('text',{x:CW/2,y:H,'text-anchor':'middle','font-size':FS,'font-family':'ui-monospace,JetBrains Mono,monospace',fill:'rgba(124,92,255,.14)',style:'font-feature-settings:"zero"'},fillG);
const watT=el('text',{x:CW/2,y:H,'text-anchor':'middle','font-size':FS,'font-family':'ui-monospace,JetBrains Mono,monospace',fill:'none',stroke:'#a99bff','stroke-width':1.6,style:'font-feature-settings:"zero"'},waterG);
const backOut=t=>{const c=1.70158*.9,c3=c+1;return 1+c3*Math.pow(t-1,3)+c*Math.pow(t-1,2)}, ioCubic=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
let idx=0,dwellStart=performance.now(),paused=false,pausedAt=0,sweepT0=-1e9;
const digits=v=>String(v).padStart(W,'0').split('').map(Number);
const bar=document.getElementById('bar');let segs=[];
F.forEach((f,i)=>{if(i&&f[0]!==F[i-1][0])bar.appendChild(Object.assign(document.createElement('div'),{className:'gap'}));
 const s=document.createElement('div');s.className='seg';s.innerHTML='<i></i>';s.onclick=e=>{e.stopPropagation();go(i)};bar.appendChild(s);segs.push(s.firstChild)});
function setText(){const f=F[idx];lab.textContent=f[1];ttl.textContent=f[2];cnt.textContent=String(idx+1).padStart(2,'0')+' / '+String(N).padStart(2,'0');
 fillT.textContent=watT.textContent=digits(idx+1)[W-1]}
function go(next){
 const now=performance.now(), a=digits(idx+1), b=digits(next+1), wrap=next<idx&&idx===N-1&&next===0, back=next<idx&&!wrap;
 cols.forEach((c,k)=>{ if(a[k]===b[k])return;
  c.from=c.pos; c.to=b[k]; c.t0=now;
  if(wrap){c.dur=760;c.ease=ioCubic}            // rewind: spin down through every digit
  else if(Math.abs(b[k]-a[k])>1&&!back&&!wrap){c.to=b[k]+(b[k]<a[k]?10:0);c.dur=520;c.ease=backOut}
  else{c.dur=520;c.ease=backOut}
 });
 sweepT0=now; idx=next; dwellStart=now; setText();
}
card.onpointerdown=e=>{const r=card.getBoundingClientRect(),x=e.clientX-r.left;card._t=performance.now();card._x=x;
 card._hold=setTimeout(()=>{paused=true;pausedAt=performance.now()},280)};
card.onpointerup=()=>{clearTimeout(card._hold);if(paused){paused=false;dwellStart+=performance.now()-pausedAt;return}
 const w=card.clientWidth; go(card._x>w/2?(idx+1)%N:(idx-1+N)%N)};
function frame(now){
 // columns
 let rolling=false;
 cols.forEach(c=>{const t=Math.min(1,(now-c.t0)/c.dur);if(t<1)rolling=true;
  c.pos=c.from+(c.to-c.from)*(c.ease?c.ease(t):1); if(t>=1){c.pos=((c.to%10)+10)%10;c.from=c.pos}
  c.strip.setAttribute('transform',`translate(0,${-c.pos*H})`)});
 // charge
 const p=paused?(pausedAt-dwellStart)/DWELL:(now-dwellStart)/DWELL;
 if(!paused&&p>=1){go((idx+1)%N)}
 const lvl=rolling?0:Math.max(0,Math.min(1,p)), top=H-lvl*(FS*.72);
 fr.setAttribute('y',top);fr.setAttribute('height',H-top+40);wr.setAttribute('y',top-.8);
 waterG.style.opacity=rolling?0:(paused?.5+.5*Math.sin(now/255):1); fillG.style.opacity=rolling?0:1;
 // sweep
 const s=(now-sweepT0)/620, o=s<1?-.15+s*1.3:2;
 [['s0',o-.12],['s1',o],['s2',o+.12]].forEach(([id,v])=>document.getElementById(id).setAttribute('offset',Math.max(0,Math.min(1,v))));
 // progress bar
 segs.forEach((g,i)=>g.style.width=(i<idx?100:i>idx?0:Math.min(100,lvl*100))+'%');
 requestAnimationFrame(frame);
}
setText();requestAnimationFrame(frame);
</script></body></html>
