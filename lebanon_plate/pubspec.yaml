name: lebanon_plate
description: "Lebanon's licence plates for the core_plate library — the one-line and two-line specs, the letter and digit alphabets, the eight usage colour themes and the advisory validator."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/plate-lebanon

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine. The only dependency, and deliberately so: not
  # any other country's package.
  core_plate: ^0.9.0
  # Shared alphabet definitions.
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/cedar.svg

# No font. `PlateTheme` names no font family and `core_plate` offers no
# hook to give one to a label, so a font bundled here could not reach the لبنان
# on the band. Supplying a face to the subtree is the host's job, via its own
# `Theme` / `DefaultTextStyle`.
