include: ../analysis_options.yaml

# Package-specific: plate_gallery ships web and Linux desktop runners, whose
# generated code under these directories is not this package's to lint.
# `exclude:` is a list, so it replaces rather than extends the base's — build/**
# has to be restated here or the base's own exclusion is lost.
analyzer:
  exclude:
    - build/**
    - web/**
    - linux/**
