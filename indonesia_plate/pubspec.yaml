name: indonesia_plate
description: "Indonesia's licence plates for the core_plate library — the 2023 FE-Schrift car plate, the motorcycle plate and the diplomatic plate, with their usage and EV liveries, alphabets and advisory validators."
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.11.0
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
