name: cuba_plate
description: "Cuba's licence plates for the plate_core library — the 2013 car plate (natural-person and legal-entity strips), the motorcycle plate, the letter alphabet and the advisory validator."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/plate-cuba

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.0
  # Shared alphabet definitions.
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No assets. A Cuban plate carries no flag; its country mark is the word CUBA,
# which the specs print as a label. The laser-printed island hologram on the
# real plate is a security feature, not artwork worth approximating.
