name: plate_number
description: " A Flutter package for capturing and displaying vehicle plate numbers."
version: 0.1.0
homepage: https://github.com/ArAdBey/plate-number

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# No `flutter:` section: as of P8 the core ships no assets at all. Every image
# on a plate face belongs to the country package that names it (`iran_plate`,
# `germany_plate`), because an asset reference resolves against the bundle of
# the package that declares it. `flutter_svg` stays a dependency — `PlateFlag`
# renders whatever `SvgPlateAsset` a country hands it.
