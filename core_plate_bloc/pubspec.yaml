name: core_plate_bloc
description: "The optional bloc layer for the core_plate library — PlateCardBloc, the PlateCardBinding seam that mirrors it onto a PlateController, and the bloc-reading read-only views."
version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/core-plate-bloc

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral engine, for PlateController, PlateSpec, PlateNumber and
  # PlateCanvas. 0.4.0 is the release that stopped depending on bloc itself.
  core_plate: ^0.4.0
  flutter_bloc: ^9.1.1
  bloc: ^9.2.1

dev_dependencies:
  flutter_lints: ^6.0.0

# No `flutter:` section: this package ships no assets. It is state plumbing and
# two thin widgets over the core's own rendering.
