name: plate_gallery
description: Every plate every country package in this repo can draw, in one app.
publish_to: none
version: 1.0.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  core_plate: ^0.9.0
  plate_keypad: ^0.1.1
  iran_plate: ^0.2.0
  germany_plate: ^0.2.0
  palestine_plate: ^0.3.0
  yemen_plate: ^0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
