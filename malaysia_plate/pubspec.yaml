name: malaysia_plate
description: "Malaysia's licence plates for the plate_core library — the single-row and two-row JPJ plates, the diplomatic plate and the JPJePlate, with their themes, alphabets and advisory validator."
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.0
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/flags/Flag_of_Malaysia.svg
