name: plate_number
description: " A Flutter package for capturing and displaying vehicle plate numbers."
version: 0.0.2
homepage: https://github.com/ArAdBey/plate-number

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.4
  bloc_concurrency: ^0.2.2
  bloc: ^8.1.4
  country_flags: ^4.1.2
  flutter_svg: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  bloc_test: ^9.1.7
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/de_inspection_sticker.png
    - assets/de_state_seal.png
    - assets/flags/Flag_of_Iran.svg
