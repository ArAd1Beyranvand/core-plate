version: 0.1.0
homepage: https://github.com/ArAd1Beyranvand/plate

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # The country-neutral alphabet and slot definitions.
  core_plate: ^0.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
