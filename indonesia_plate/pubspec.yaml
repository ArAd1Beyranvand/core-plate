name: indonesia_plate
description: "Indonesia's licence plates for the plate_core library — the 2023 FE-Schrift car plate, the motorcycle plate and the diplomatic plate, with their usage and EV liveries, alphabets and advisory validators."
version: 0.1.0

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: ">=1.17.0"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  plate_core: ^0.11.0
  plate_alphabet:
    path: ../plate_alphabet

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
